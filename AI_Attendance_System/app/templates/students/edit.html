<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Student</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-header bg-warning">

                    <h4 class="mb-0">
                        Edit Student
                    </h4>

                </div>

                <div class="card-body">

                    {% with messages = get_flashed_messages(
                        with_categories=true
                    ) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div
                                    class="alert alert-{{ category }}"
                                >
                                    {{ message }}
                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    class="form-label"
                                    for="student_id"
                                >
                                    Student ID *
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="student_id"
                                    name="student_id"
                                    value="{{ student.student_id }}"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    class="form-label"
                                    for="name"
                                >
                                    Full Name *
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    value="{{ student.name }}"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    class="form-label"
                                    for="email"
                                >
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    value="{{ student.email or '' }}"
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    class="form-label"
                                    for="phone"
                                >
                                    Phone
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    name="phone"
                                    value="{{ student.phone or '' }}"
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    class="form-label"
                                    for="department"
                                >
                                    Department
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="department"
                                    name="department"
                                    value="{{ student.department or '' }}"
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    class="form-label"
                                    for="course"
                                >
                                    Course
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="course"
                                    name="course"
                                    value="{{ student.course or '' }}"
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    class="form-label"
                                    for="semester"
                                >
                                    Semester
                                </label>

                                <select
                                    class="form-select"
                                    id="semester"
                                    name="semester"
                                >

                                    <option value="">
                                        Select Semester
                                    </option>

                                    {% for number in range(1, 5) %}

                                        <option
                                            value="{{ number }}"
                                            {% if student.semester == number|string %}
                                                selected
                                            {% endif %}
                                        >
                                            Semester {{ number }}
                                        </option>

                                    {% endfor %}

                                </select>

                            </div>

                        </div>


                        <div class="mt-3">

                            <button
                                type="submit"
                                class="btn btn-warning"
                            >
                                Update Student
                            </button>

                            <a
                                href="{{ url_for(
                                    'student.view_student',
                                    student_id=student.id
                                ) }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
