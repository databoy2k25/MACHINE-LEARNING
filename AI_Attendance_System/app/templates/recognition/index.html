<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Face Recognition</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f6f9;
        }

        .camera-box {
            max-width: 700px;
            margin: auto;
        }

        video {
            width: 100%;
            border-radius: 12px;
            background: #000;
        }

        #canvas {
            display: none;
        }

        .btn-large {
            padding: 12px 30px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="text-center mb-4">
        <h2 class="fw-bold">Face Recognition</h2>
        <p class="text-muted">
            Look at the camera and capture your face
        </p>
    </div>

    <div class="card shadow camera-box">

        <div class="card-body">

            <!-- FLASH MESSAGES -->

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- CAMERA -->

            <video
                id="video"
                autoplay
                playsinline
            ></video>

            <canvas id="canvas"></canvas>


            <!-- CAPTURE FORM -->

            <form
                id="recognitionForm"
                method="POST"
                action="{{ url_for('recognition.recognize_face') }}"
                enctype="multipart/form-data"
            >

                <input
                    type="file"
                    id="face_image"
                    name="face_image"
                    hidden
                >

                <div class="text-center mt-4">

                    <button
                        type="button"
                        id="captureBtn"
                        class="btn btn-primary btn-large"
                    >
                        Capture & Recognize
                    </button>

                </div>

            </form>


            <div class="text-center mt-3">

                <a
                    href="{{ url_for('auth.student_logout') }}"
                    class="btn btn-danger"
                >
                Logout
                </a>

            </div>

        </div>

    </div>

</div>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const captureBtn = document.getElementById("captureBtn");
const form = document.getElementById("recognitionForm");
const fileInput = document.getElementById("face_image");


/* =====================================================
   START CAMERA
===================================================== */

navigator.mediaDevices.getUserMedia({
    video: true
})
.then(function(stream) {

    video.srcObject = stream;

})
.catch(function(error) {

    alert(
        "Camera access failed. Please allow camera permission."
    );

});


/* =====================================================
   CAPTURE IMAGE
===================================================== */

captureBtn.addEventListener(
    "click",
    function() {

        const width = video.videoWidth;
        const height = video.videoHeight;

        if (!width || !height) {

            alert(
                "Camera is not ready yet."
            );

            return;
        }


        canvas.width = width;
        canvas.height = height;


        const context =
            canvas.getContext("2d");


        context.drawImage(
            video,
            0,
            0,
            width,
            height
        );


        canvas.toBlob(
            function(blob) {

                const file =
                    new File(
                        [blob],
                        "face.jpg",
                        {
                            type: "image/jpeg"
                        }
                    );


                const dataTransfer =
                    new DataTransfer();

                dataTransfer.items.add(file);

                fileInput.files =
                    dataTransfer.files;


                captureBtn.disabled = true;

                captureBtn.innerText =
                    "Recognizing...";


                form.submit();

            },
            "image/jpeg",
            0.95
        );

    }
);

</script>

</body>

</html>
